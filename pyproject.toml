[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "evalkit"
version = "0.1.0"
description = "Evals as code for LLM apps and agents. Write tasks and graders in YAML, run them in CI, fail the build on regressions."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "superintelligenceco contributors" }]
keywords = ["llm", "evals", "evaluation", "testing", "ci", "agents", "llm-as-judge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1",
  "jsonschema>=4.21",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16,<0.17",
  "types-jsonschema",
  "types-PyYAML",
]

[project.scripts]
evalkit = "evalkit.cli:main"

[project.urls]
Homepage = "https://github.com/superintelligenceco/evalkit"
Issues = "https://github.com/superintelligenceco/evalkit/issues"
Changelog = "https://github.com/superintelligenceco/evalkit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit"]

[tool.hatch.build.targets.sdist]
include = ["src/evalkit", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "RET", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src/evalkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["evalkit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
