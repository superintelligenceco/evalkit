site_name: evalkit
site_description: Evals as code for LLM apps and agents. Write tasks and graders in YAML, run them in CI, and fail the build on regressions.
site_url: https://superintelligenceco.github.io/evalkit/
repo_url: https://github.com/superintelligenceco/evalkit
repo_name: superintelligenceco/evalkit
edit_uri: edit/main/docs/
copyright: Copyright 2026 superintelligenceco contributors. Apache-2.0.

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - CI integration: ci.md
  - Reference:
      - Command line: reference/cli.md
      - Suite file: reference/suite.md
      - Suite JSON Schema: reference/schema.md
  - Architecture: architecture.md
  - Decisions:
      - adr/index.md
      - adr/0001-strict-yaml-suites.md
      - adr/0002-sqlite-response-cache.md
      - adr/0003-tag-driven-release.md
      - adr/0004-standalone-executables-with-pyinstaller.md
  - FAQ: faq.md
