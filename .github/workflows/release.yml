# Builds and publishes a release when you push a vX.Y.Z tag:
#
# - the wheel and sdist, published to PyPI as sic-evalkit,
# - standalone `evalkit` executables (PyInstaller) for Linux, macOS, and Windows,
# - the multi-arch image on ghcr.io/superintelligenceco/evalkit, signed with cosign,
# - SPDX SBOMs, SHA256SUMS, and build provenance attestations,
# - a GitHub Release with the notes from CHANGELOG.md and every file above attached.
#
# A manual run (workflow_dispatch) on a branch builds the files and keeps them on the run only.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  python-dist:
    name: Wheel, sdist, and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v$version" = "$TAG" || { echo "::error::tag $TAG does not match version $version"; exit 1; }
      - name: Build
        run: |
          python -m pip install build
          python -m build --outdir python-dist
      - name: Install the wheel in a clean venv and run the starter suite
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install python-dist/*.whl
          cd "$(mktemp -d)"
          "$RUNNER_TEMP/venv/bin/evalkit" --version
          "$RUNNER_TEMP/venv/bin/evalkit" init
          "$RUNNER_TEMP/venv/bin/evalkit" run evals.yaml
      # The executables bundle exactly the packages installed in this venv.
      - name: Generate the SBOM for the wheel and the executables
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ runner.temp }}/venv
          format: spdx-json
          output-file: python-dist/evalkit.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: python-dist/
          if-no-files-found: error

  # Linux executables build in Debian bullseye (glibc 2.31) so they run on older distributions too.
  binary-linux:
    name: Executable (${{ matrix.asset }})
    needs: python-dist
    runs-on: ${{ matrix.runner }}
    container: python:3.12-slim-bullseye@sha256:411fa4dcfdce7e7a3057c45662beba9dcd4fa36b2e50a2bfcd6c9333e59bf0db
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: evalkit-linux-x64
            runner: ubuntu-latest
          - asset: evalkit-linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: python-dist
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq binutils
          python -m venv /opt/venv
          /opt/venv/bin/pip install python-dist/*.whl "pyinstaller==$PYINSTALLER_VERSION"
      - name: Build and smoke-test
        env:
          ASSET: ${{ matrix.asset }}
        run: /opt/venv/bin/python scripts/build_binary.py "$ASSET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  binary-native:
    name: Executable (${{ matrix.asset }})
    needs: python-dist
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: evalkit-macos-arm64
            runner: macos-latest
            file: evalkit-macos-arm64
          - asset: evalkit-macos-x64
            runner: macos-15-intel
            file: evalkit-macos-x64
          - asset: evalkit-windows-x64
            runner: windows-latest
            file: evalkit-windows-x64.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: python-dist
      - name: Install build tools
        run: python -m pip install python-dist/*.whl "pyinstaller==$PYINSTALLER_VERSION"
      - name: Build and smoke-test
        env:
          ASSET: ${{ matrix.asset }}
        run: python scripts/build_binary.py "$ASSET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error

  image:
    name: Container image
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/docker.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

  assemble:
    name: SHA256SUMS and provenance
    needs: [python-dist, binary-linux, binary-native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Compute checksums
        run: |
          cd assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance for the executables, wheel, and sdist
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/evalkit-*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [assemble, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: python-dist
      - name: Keep only the wheel and sdist
        run: |
          mkdir dist
          mv python-dist/*.whl python-dist/*.tar.gz dist/
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Build provenance for the wheel and sdist is on the GitHub Release instead.
          attestations: false

  publish:
    name: Publish the GitHub Release
    needs: [assemble, image, pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-image
          path: assets
      - name: Extract the release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "pip install sic-evalkit==$version"
            echo "curl -fsSL https://raw.githubusercontent.com/$GH_REPO/main/install.sh | EVALKIT_VERSION=$TAG sh"
            echo '```'
            echo
            echo "### Container image"
            echo
            echo '```sh'
            echo "docker run --rm ghcr.io/$GH_REPO:$version run evals.yaml"
            echo '```'
            echo
            echo "Verify a download with \`gh attestation verify <file> -R $GH_REPO\` and the image with"
            echo "\`gh attestation verify oci://ghcr.io/$GH_REPO:$version -R $GH_REPO\`."
          } >> notes.md
          test -s notes.md
          cat notes.md
      - name: Create or update the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --latest
          fi
          gh release upload "$TAG" assets/* --clobber
      - name: Move the major version tag
        # Lets workflows pin the action to `superintelligenceco/evalkit@v0` (or @v1, and so on).
        run: |
          major="${TAG%%.*}"
          sha="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)"
          if [ "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.type)" = "tag" ]; then
            sha="$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .object.sha)"
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$major" -f sha="$sha" -F force=true
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$major" -f sha="$sha"
          fi
