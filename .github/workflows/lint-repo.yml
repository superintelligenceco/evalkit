# Lints the workflow files with actionlint and checks the links in the Markdown files with lychee.
name: Repo lint

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install actionlint and shellcheck
        run: python -m pip install "actionlint-py==1.7.12.25" "shellcheck-py==0.11.0.1"
      - name: Run actionlint
        run: actionlint -color

  links:
    name: Markdown links (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --cache --max-cache-age 1d
            --max-retries 4
            --accept 200..=299,403,429
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
