# Builds the evalkit container image, tests it, and scans it with Trivy.
#
# - Pull request: build, run the example suites in the image, scan.
# - Push to main: the same, then publish a multi-arch `edge` image to GHCR.
# - Called by the Release workflow on a vX.Y.Z tag: publish `X.Y.Z`, `X.Y`, and `latest`, sign the
#   image with cosign, attest its build provenance, and hand back an SBOM.
name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      publish:
        description: Push, sign, and attest the image.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Build, test, and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: evalkit:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the built-in starter suite
        run: docker run --rm evalkit:test run evals.yaml
      - name: Run the example suites from a mounted directory
        run: |
          mkdir -p out
          run() { docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" evalkit:test "$@"; }
          run --version
          run validate examples/quickstart/evals.yaml examples/support-bot/evals.yaml examples/flaky/evals.yaml
          run run examples/quickstart/evals.yaml -o out/quickstart.json
          run run examples/support-bot/evals.yaml -o out/support-bot.json --junit out/support-bot.xml
          run compare out/quickstart.json out/quickstart.json
          python3 - <<'PY'
          import json
          summary = json.load(open("out/support-bot.json"))["summary"]
          assert (summary["passed"], summary["tasks"]) == (7, 8), summary
          print("support-bot in the image: 7/8 passed, as expected")
          PY
      - name: Scan for CRITICAL vulnerabilities (fails the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: evalkit:test
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Scan for all vulnerabilities (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: evalkit:test
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          skip-setup-trivy: true
      - name: Upload the SARIF to code scanning
        if: always() && hashFiles('trivy-results.sarif') != '' && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

  publish:
    name: Publish to GHCR
    needs: test
    if: inputs.publish || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Generate the image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: evalkit-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-image
          path: evalkit-image.spdx.json
          if-no-files-found: error
