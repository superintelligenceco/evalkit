# Mutation testing with mutmut, once a week. It mutates the pure core listed under
# [tool.mutmut] in pyproject.toml and reports the mutants that no test caught.
name: Mutation testing

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    name: mutmut
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]" "mutmut>=3,<4"
      - name: Run mutmut
        run: mutmut run
      - name: Summarize the results
        if: always()
        run: |
          {
            echo "## Mutation testing"
            echo
            echo '```'
            mutmut results || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants
          path: mutants/mutmut-stats.json
          if-no-files-found: warn
